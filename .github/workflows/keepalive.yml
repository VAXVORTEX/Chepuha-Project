        run: |
          curl -s -X GET "https://rrxtcekxpzlomiecmoqy.supabase.co/rest/v1/games?select=id&limit=1" \
          -H "apikey: sb_publishable_PotUKYXlrupLLi4hCmIySg_Ab9vvLJO" \
          -H "Authorization: Bearer sb_publishable_PotUKYXlrupLLi4hCmIySg_Ab9vvLJO" \
